<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:'Segoe UI',Inter,'Liberation Sans',sans-serif;font-size:11.5px;color:#000;-webkit-font-smoothing:antialiased}
#root{position:relative}
/* ---------- stage modes ---------- */
.stage-gif{width:900px;height:862px;background:linear-gradient(135deg,#0b2a4a 0%,#123c69 55%,#0e5a8a 100%);position:relative;overflow:hidden}
.stage-annot{width:1620px;height:900px;background:linear-gradient(135deg,#0b2a4a 0%,#123c69 60%,#0e5a8a 100%);position:relative;overflow:hidden}
.brand{position:absolute;font-family:Inter;font-weight:700;color:#fff;letter-spacing:.2px}
.brand small{display:block;font-weight:500;color:#9fc7ee;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
/* ---------- window ---------- */
.win{position:absolute;background:#fff;box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 0 1px #1a5fa8}
.title{height:31px;display:flex;align-items:center;background:#fff;border-bottom:1px solid #e5e5e5;position:relative}
.title .ico{width:16px;height:16px;margin:0 8px 0 9px}
.title .t{font-size:12px;color:#000}
.title .btns{position:absolute;right:0;top:0;display:flex}
.title .btns div{width:46px;height:30px;display:flex;align-items:center;justify-content:center;color:#333;font-size:13px}
.client{position:relative;background:#fff}
.a{position:absolute}
.lbl{white-space:pre-wrap;line-height:15px}
.btn{position:absolute;background:#e1e1e1;border:1px solid #adadad;display:flex;align-items:center;justify-content:center;text-align:center;line-height:13px}
.btn.def{border:2px solid #0078d7}
.btn.bold{font-weight:700}
.btn.dis{color:#a0a0a0;background:#ececec;border-color:#cfcfcf}
.btn.hot{background:#e5f1fb;border-color:#0078d7}
.btn.press{background:#cce4f7;border-color:#005499}
.edit{position:absolute;border:1px solid #7a7a7a;background:#fff;padding:0 4px;display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.combo{position:absolute;border:1px solid #adadad;background:#e5e5e5;padding:0 22px 0 5px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;height:23px}
.combo:after{content:'';position:absolute;right:7px;top:8px;border:4px solid transparent;border-top:5px solid #333}
.chk{position:absolute;display:flex;align-items:center;white-space:nowrap}
.box{width:13px;height:13px;border:1px solid #333;background:#fff;margin-right:6px;flex:none;position:relative}
.box.on:after{content:'';position:absolute;left:3px;top:0px;width:4px;height:8px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg)}
.group{position:absolute;border:1px solid #dcdcdc;border-radius:2px}
.group span{position:absolute;top:-8px;left:8px;background:#fff;padding:0 3px}
.tabctl{position:absolute;border:1px solid #d9d9d9;border-top:none}
.tabs{position:absolute;left:10px;top:10px;height:24px;display:flex}
.tab{height:22px;margin-top:2px;padding:0 6px;border:1px solid #d9d9d9;border-bottom:none;background:#f0f0f0;display:flex;align-items:center;white-space:pre;margin-right:-1px}
.tab.sel{height:24px;margin-top:0;background:#fff;position:relative;z-index:2}
.tabline{position:absolute;left:10px;top:33px;width:800px;border-top:1px solid #d9d9d9}
.lv{position:absolute;border:1px solid #828790;background:#fff;overflow:hidden}
.lv .hdr{display:flex;height:24px;border-bottom:1px solid #e5e5e5}
.lv .hdr div{padding:0 6px;display:flex;align-items:center;border-right:1px solid #e5e5e5;white-space:nowrap;overflow:hidden;color:#4c607a}
.lv .row{display:flex;height:19px;align-items:center}
.lv .row div{padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center}
.lv .row.sel{background:#cce8ff}
.lv .row .box{margin-right:5px}
.prog{position:absolute;background:#e6e6e6;border:1px solid #bcbcbc}
.prog i{position:absolute;left:0;top:0;bottom:0;background:#06b025}
.log{position:absolute;border:1px solid #7a7a7a;background:#fff;padding:2px 4px;font-family:Consolas,'DejaVu Sans Mono',monospace;font-size:10.5px;line-height:14px;overflow:hidden;white-space:pre;color:#111}
.log .w{color:#b45309}.log .ok{color:#047857;font-weight:600}
.rtl{direction:rtl}
.rtl .combo{padding:0 5px 0 22px}.rtl .combo:after{right:auto;left:7px}
.rtl .box{margin-right:0;margin-left:6px}.rtl .lv .row .box{margin-right:0;margin-left:5px}
.rtl .group span{left:auto;right:8px}
.rtl .prog i{left:auto;right:0}
.rtl.title .btns{right:auto;left:0}
.rtl.title .ico{margin:0 9px 0 8px}
.edit,.combo,.lv .row div,.lv .hdr div,.log,.lbl{unicode-bidi:plaintext}
/* modal dim */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.08)}
/* message box */
.mb .msg{display:flex;padding:22px 24px 18px 18px;gap:12px;line-height:16px;font-size:12px;white-space:pre-wrap}
.mb .bar{background:#f0f0f0;border-top:1px solid #dfdfdf;height:42px;position:relative}
.qicon{width:32px;height:32px;border-radius:50%;background:#1f6fd1;color:#fff;font:700 20px Inter;display:flex;align-items:center;justify-content:center;flex:none}
/* cursor */
#cursor{position:absolute;width:22px;height:30px;z-index:50;pointer-events:none;filter:drop-shadow(1px 2px 2px rgba(0,0,0,.4))}
.ripple{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:3px solid #ffb020;background:rgba(255,176,32,.25);z-index:49}
/* captions (gif) */
.cap{position:absolute;left:0;right:0;bottom:0;height:96px;background:rgba(5,20,38,.88);display:flex;align-items:center;gap:18px;padding:0 34px;direction:rtl;border-top:3px solid #ff9a1f}
.cap .num{width:52px;height:52px;border-radius:50%;background:#ff9a1f;color:#1b1b1b;font:800 26px Inter,'Noto Kufi Arabic';display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 0 5px rgba(255,154,31,.25)}
.cap .txt{color:#fff;font:600 21px/1.5 Inter,'Noto Kufi Arabic','Noto Sans Arabic';}
.cap .txt small{display:block;font:400 15px/1.5 Inter,'Noto Sans Arabic';color:#bcd6f0}
.topbar{position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:#fff}
.topbar .l{font:700 15px Inter}
.topbar .r{font:600 15px Inter,'Noto Kufi Arabic';direction:rtl;color:#cfe3f7}
/* badges */
.badge{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#ff7a00;color:#fff;font:800 13px Inter;display:flex;align-items:center;justify-content:center;z-index:40;box-shadow:0 0 0 3px #fff,0 3px 8px rgba(0,0,0,.45)}
.hl{position:absolute;border:2.5px solid #ff7a00;border-radius:4px;z-index:39;box-shadow:0 0 0 3px rgba(255,122,0,.18)}
/* annot panel */
.panel{position:absolute;direction:rtl;color:#fff}
.panel h1{font:700 30px/1.35 Inter,'Noto Kufi Arabic';margin-bottom:6px}
.panel .sub{font:400 15px/1.6 Inter,'Noto Sans Arabic';color:#b9d4ef;margin-bottom:18px}
.item{display:flex;gap:12px;align-items:flex-start;margin-bottom:11px}
.item .n{width:28px;height:28px;border-radius:50%;background:#ff7a00;color:#fff;font:800 14px Inter;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.item .d{font:400 14.5px/1.55 Inter,'Noto Sans Arabic';color:#e8f1fb}
.item .d b{font-family:Inter,'Noto Kufi Arabic';font-weight:700;color:#fff;font-size:14.5px}
.item .d code{font-family:Inter;direction:ltr;unicode-bidi:isolate;background:rgba(255,255,255,.12);padding:0 5px;border-radius:3px;font-size:13px}
.foot{position:absolute;font:500 13px Inter;color:#8fb6dc}
</style></head>
<body><div id="root"></div>
<script>
const ICON = `<svg class="ico" viewBox="0 0 16 16"><rect x="0.5" y="2" width="6.5" height="5" rx="1" fill="#5a6473"/><rect x="9" y="2" width="6.5" height="5" rx="1" fill="#146ed2"/><rect x="1.3" y="2.8" width="4.9" height="3.4" fill="#eaf5ff"/><rect x="9.8" y="2.8" width="4.9" height="3.4" fill="#eaf5ff"/><path d="M4.5 12h5v-1.6l3 2.6-3 2.6V14h-5z" fill="#1fa050"/></svg>`;
const CURSOR = `<svg viewBox="0 0 22 30"><path d="M2 1 L2 24 L7.5 18.5 L11.5 28 L15 26.5 L11 17.5 L19 17.5 Z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
let UI={}, RTL=false, CW=820;
function U(k,f){let v=UI[k]; if(v==null) v=f; return String(v).replace(/&&/g,'&');}
function MX(x,w){return RTL?CW-x-w:x}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function btn(x,y,w,h,t,cls=''){return `<div class="btn ${cls}" style="left:${MX(x,w)}px;top:${y}px;width:${w}px;height:${h}px">${t}</div>`}
function lbl(x,y,w,t,extra=''){return `<div class="a lbl" style="left:${MX(x,w)}px;top:${y}px;width:${w}px;${extra}">${t}</div>`}
function chk(x,y,w,t,on,cls=''){return `<div class="chk ${cls}" style="left:${MX(x,w)}px;top:${y}px;width:${w}px;height:24px"><div class="box ${on?'on':''}"></div>${t}</div>`}
function edit(x,y,w,h,t){return `<div class="edit" style="left:${MX(x,w)}px;top:${y}px;width:${w}px;height:${h}px">${esc(t)}</div>`}
function combo(x,y,w,t){return `<div class="combo" style="left:${MX(x,w)}px;top:${y}px;width:${w}px">${esc(t)}</div>`}
function lv(x,y,w,h,cols,rows,checks=true){
  let s=`<div class="lv" style="left:${MX(x,w)}px;top:${y}px;width:${w}px;height:${h}px"><div class="hdr">`;
  cols.forEach(c=>s+=`<div style="width:${c[1]}px">${c[0]}</div>`); s+='</div>';
  rows.forEach(r=>{s+=`<div class="row ${r.sel?'sel':''}">`;
    r.cells.forEach((c,i)=>{s+=`<div style="width:${cols[i][1]}px">${i==0&&checks?`<span class="box ${r.checked?'on':''}"></span>`:''}${esc(c)}</div>`});
    s+='</div>'});
  return s+'</div>';
}
function winFrame(x,y,w,h,title,inner,extraStyle=''){
  return `<div class="win" style="left:${x}px;top:${y}px;width:${w}px;${extraStyle}">
   <div class="title ${RTL?'rtl':''}">${ICON}<span class="t">${title}</span><div class="btns"><div>&#x2014;</div><div style="opacity:.35">&#x25A1;</div><div>&#x2715;</div></div></div>
   <div class="client ${RTL?'rtl':''}" style="height:${h}px">${inner}</div></div>`;
}
function hot(st,id){return st.hot===id?'hot':(st.press===id?'press':'')}
function mainClient(st){
  CW=820;
  const b=st.b, r=st.r, busy=st.busy;
  let s='';
  s+=`<div class="tabctl" style="left:10px;top:33px;width:800px;height:389px"></div><div class="tabline"></div>`;
  s+=`<div class="tabs" style="${RTL?'left:auto;right:10px':''}"><div class="tab ${st.tab==0?'sel':''}">${esc(U('S_TAB_BACKUP','  1. Backup  (old PC)  '))}</div><div class="tab ${st.tab==1?'sel':''}">${esc(U('S_TAB_RESTORE','  2. Restore  (new PC)  '))}</div></div>`;
  s+=btn(690,8,120,24,U('S_SETTINGS','Settings'));
  if(st.tab==0){
    s+=lbl(24,49,400,esc(U('S_B_SRC','Source Windows installation (old PC):')));
    s+=combo(24,68,580,b.src);
    s+=btn(614,67,180,26,U('S_REFRESH','Refresh'),busy?'dis':hot(st,'refresh'));
    s+=lbl(24,105,300,esc(U('S_B_USERS','User profiles to transfer:')));
    s+=lv(24,124,370,186,[[U('S_COL_USER','User'),120],[U('S_COL_PROFILE','Profile folder'),246]],b.users.map(u=>({cells:[u.name,u.path],checked:u.checked})));
    s+=`<div class="group" style="left:${MX(410,384)}px;top:100px;width:384px;height:210px"><span>${esc(U('S_B_GROUP','What to transfer'))}</span></div>`;
    s+=chk(424,126,362,esc(U('S_B_FILES','User files  (Desktop, Documents, Pictures, Downloads...)')),b.files);
    s+=chk(424,154,362,esc(U('S_B_BROWSERS','Browsers  (Chrome, Edge, Brave, Opera, Firefox)')),b.browsers);
    s+=chk(424,182,362,esc(U('S_B_SETTINGS','Windows settings  (mouse, keyboard, theme, wallpaper, Wi-Fi)')),b.settings);
    s+=chk(424,210,362,esc(U('S_B_PROGRAMS','List of installed programs  (reinstall with winget)')),b.programs);
    s+=chk(424,238,262,esc(U('S_B_APPS_FMT','Programs with their files && data  (%d selected)').replace('%d',b.appsCount)),b.apps);
    s+=btn(690,236,96,26,U('S_CHOOSE','Choose...'),busy?'dis':hot(st,'choose'));
    s+=lbl(424,270,362,esc(U('S_B_TIP',"Works from Hiren's BootCD PE (offline) or from the running Windows. Close browsers/programs first when the old PC is running.")),'color:#222;font-size:11px;line-height:14px');
    s+=lbl(24,323,500,esc(U('S_B_DEST','Save the migration package to (external disk / USB):')));
    s+=edit(24,342,480,26,b.dest);
    s+=btn(512,341,92,28,U('S_BROWSE','Browse...'),busy?'dis':hot(st,'bbrowse'));
    s+=btn(614,336,180,38,U('S_B_START','Start Backup'),'def bold '+(busy?'dis':hot(st,'bstart')));
  } else {
    s+=lbl(24,49,400,esc(U('S_R_PKG','Migration package folder (PCMigrate_xxxx):')));
    s+=edit(24,68,480,26,r.pkg);
    s+=btn(512,67,92,28,U('S_BROWSE','Browse...'),busy?'dis':'');
    s+=btn(614,67,180,28,U('S_LOAD','Load'),busy?'dis':hot(st,'load'));
    s+=lbl(24,105,200,esc(U('S_R_SRCUSER','User in the package:')));
    s+=combo(24,124,200,r.srcUser);
    s+=lbl(236,105,300,esc(U('S_R_TGT','Restore into this profile:')));
    s+=combo(236,124,368,r.tgt);
    s+=chk(24,160,130,esc(U('S_R_FILES','User files')),r.files);
    s+=chk(160,160,120,esc(U('S_R_BROWSERS','Browsers')),r.browsers);
    s+=chk(286,160,260,esc(U('S_R_SETTINGS','Windows settings + Wi-Fi')),r.settings);
    s+=btn(614,112,180,38,U('S_R_START','Start Restore'),'def bold '+(busy?'dis':hot(st,'rstart')));
    s+=lbl(24,197,770,esc(U('S_R_PROGS',"Programs from the old PC  -  'Copy' = transferred from the package with its data,  'winget' = downloaded and installed:")));
    s+=lv(24,216,770,160,[[U('S_COL_PROGRAM','Program'),330],[U('S_COL_VERSION','Version'),100],[U('S_COL_METHOD','Method'),336]],r.progs.map(p=>({cells:[p.name,p.ver,p.method],checked:p.checked,sel:p.sel})));
    s+=btn(24,382,150,30,U('S_CHECK_REC','Check recommended'),busy?'dis':'');
    s+=btn(180,382,100,30,U('S_UNCHECK','Uncheck all'),busy?'dis':'');
    s+=chk(290,385,316,esc(U('S_PREFWINGET','Prefer winget (clean install + data)')),r.prefer);
    s+=btn(614,382,180,30,U('S_INSTALL','Install / transfer checked'),busy?'dis':hot(st,'install'));
  }
  s+=`<div class="prog" style="left:${MX(10,690)}px;top:432px;width:690px;height:22px"><i style="width:${(st.progress||0)/10}%"></i></div>`;
  s+=btn(710,430,100,26,U('S_CANCEL','Cancel'),busy?hot(st,'cancel'):'dis');
  s+=lbl(10,461,800,esc(st.status||U('S_READY','Ready.')),'white-space:nowrap;overflow:hidden;text-overflow:ellipsis');
  const lines=(st.log||[]).slice(-12).map(l=>{let c='';if(/!|WARNING/.test(l))c='w';if(/=====.*(FINISHED|finished)|OK$|Package ready/.test(l))c='ok';return `<span class="${c}">${esc(l)}</span>`}).join('\n');
  s+=`<div class="log" style="left:10px;top:482px;width:800px;height:176px">${lines}</div>`;
  return s;
}
function chooserClient(c,st){
  CW=840;
  let s='';
  s+=lbl(12,8,816,esc(U('S_CH_INTRO','Select the programs to move WITH their files, registry, services, shortcuts and user data.\nBest for normal desktop programs. Antivirus, VPN, drivers and hardware-locked licences usually need a reinstall.')),'line-height:16px');
  s+=lv(12,50,816,400,[[U('S_COL_PROGRAM','Program'),270],[U('S_COL_VERSION','Version'),90],[U('S_COL_SIZE','Size'),75],[U('S_COL_INSTALL','Install folder / notes'),381]],c.apps.map(a=>({cells:[a.name,a.ver,a.size,a.info],checked:a.checked,sel:a.sel})));
  s+=btn(12,460,100,30,U('S_SELECT_ALL','Select all'));
  s+=btn(120,460,100,30,U('S_SELECT_NONE','Select none'));
  s+=btn(628,460,96,30,U('S_BTN_OK','OK'),'def '+hot(st,'ok'));
  s+=btn(732,460,96,30,U('S_CANCEL','Cancel'));
  return s;
}
function msgClient(m,st){
  CW=m.w;
  return `<div class="mb"><div class="msg" style="height:${m.h-42}px"><div class="qicon">?</div><div>${esc(m.text)}</div></div>
    <div class="bar">${btn(m.w-182,9,80,24,U('YES','Yes'),'def '+hot(st,'yes'))}${btn(m.w-94,9,80,24,U('NO','No'))}</div></div>`;
}
function render(st){
  UI=st.ui||{}; RTL=!!st.rtl;
  const R=document.getElementById('root');
  let s='', ox, oy;
  if(st.mode==='annot'){
    s+=`<div class="stage-annot">`;
    ox=40; oy=96;
    s+=`<div class="brand" style="left:40px;top:26px;font-size:22px">PC Migrate Portable<small>${st.kicker||''}</small></div>`;
  } else {
    s+=`<div class="stage-gif">`;
    ox=39; oy=52;
    s+=`<div class="topbar"><div class="l">PC Migrate Portable 1.2</div><div class="r" style="direction:${st.capDir||'rtl'}">${st.topRight||''}</div></div>`;
  }
  // main window
  if(!st.hideMain){
    let inner=mainClient(st);
    if(st.chooser||st.msgbox) inner+='<div class="dim"></div>';
    s+=winFrame(ox,oy,820,668,'PC Migrate Portable 1.2',inner);
  }
  if(st.chooser){
    const cx=st.chooserPos?st.chooserPos[0]:ox-10, cy=st.chooserPos?st.chooserPos[1]:oy+80;
    let inner=chooserClient(st.chooser,st); if(st.msgbox) inner+='<div class="dim"></div>';
    s+=winFrame(cx,cy,840,502,esc(U('S_CH_TITLE','Choose programs to transfer with their data')),inner);
  }
  if(st.msgbox){
    const m=st.msgbox; m.w=m.w||430; m.h=m.h||170;
    const mx=ox+(820-m.w)/2, my=oy+(668-m.h)/2;
    s+=winFrame(mx,my,m.w,m.h,'PC Migrate Portable 1.2',msgClient(m,st));
  }
  // highlights / badges (window client coords -> page)
  const base=(st.badgeBase||[ox, oy+31]);
  (st.hl||[]).forEach(h=>{const hx=RTL?(st.badgeW||820)-h[0]-h[2]:h[0];s+=`<div class="hl" style="left:${base[0]+hx-4}px;top:${base[1]+h[1]-4}px;width:${h[2]+8}px;height:${h[3]+8}px"></div>`});
  (st.badges||[]).forEach(b=>{const bx=RTL?(st.badgeW||820)-b[1]:b[1];s+=`<div class="badge" style="left:${base[0]+bx}px;top:${base[1]+b[2]}px">${b[0]}</div>`});
  if(st.panel) s+=st.panel;
  if(st.caption) s+=`<div class="cap" style="direction:${st.capDir||'rtl'}"><div class="num">${st.caption.n}</div><div class="txt">${st.caption.t}${st.caption.s?`<small>${st.caption.s}</small>`:''}</div></div>`;
  if(st.ripple) s+=`<div class="ripple" style="left:${st.ripple[0]}px;top:${st.ripple[1]}px;transform:scale(${st.ripple[2]||1});opacity:${st.ripple[3]??1}"></div>`;
  if(st.cursor) s+=`<div id="cursor" style="left:${st.cursor[0]-2}px;top:${st.cursor[1]-1}px">${CURSOR}</div>`;
  s+='</div>';
  R.innerHTML=s;
}
window.render=render;
</script></body></html>
