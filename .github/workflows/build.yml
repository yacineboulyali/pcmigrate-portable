name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 and NSIS
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 nsis zip

      - name: Build PCMigrate.exe
        run: ./build.sh

      - name: Create setup + portable zip
        run: ./package.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PCMigrate
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
