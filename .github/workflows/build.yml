name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 and NSIS
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 nsis zip

      - name: Build PCMigrate.exe
        run: ./build.sh

      - name: Create setup + portable zip
        run: ./package.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PCMigrate
          path: dist/*

      - name: Read version
        run: echo "VER=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      # Every push to main (re)publishes release v<VERSION> with the built files.
      # To ship a new version: change VERSION + RELEASE_NOTES.md and push.
      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: PC Migrate Portable ${{ env.VER }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          make_latest: true
